<!DOCTYPE html>
<html lang="en">
<head>
<title>CCAN add asks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCAN add asks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
:root {
  --ground: #f2f5f3; --paper: #ffffff; --ink: #15211c; --muted: #5f6e68; --line: #d8e0dc;
  --accent: #1f6f63; --accent-soft: #e2f0ec; --warm: #a9601a; --warm-soft: #f8ecdd;
  --done: #2e7d4f; --done-soft: #e3f2e8; --quiet: #7d8580; --quiet-soft: #eceeed;
  --k-gt: #2f5d9e; --k-ga: #7a4fa3; --k-in: #1f6f63;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light; --s: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1613; --paper: #17201c; --ink: #e3ebe7; --muted: #9db0a8; --line: #2a3832;
    --accent: #5cc0ac; --accent-soft: #1b352f; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e9893; --quiet-soft: #232b28;
    --k-gt: #7aa7e6; --k-ga: #b794e0; --k-in: #5cc0ac; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --ground: #0f1613; --paper: #17201c; --ink: #e3ebe7; --muted: #9db0a8; --line: #2a3832;
    --accent: #5cc0ac; --accent-soft: #1b352f; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e9893; --quiet-soft: #232b28;
    --k-gt: #7aa7e6; --k-ga: #b794e0; --k-in: #5cc0ac; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: calc(16px * var(--s)); line-height: 1.55; padding: 28px 16px 64px; }
a { color: var(--accent); }
button, input, textarea, select { font-family: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font-size: calc(12px * var(--s)); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(30px, 6vw, 42px) * var(--s)); line-height: 1.08; margin: 6px 0 0; text-wrap: balance; }
h1 em { font-style: italic; color: var(--accent); }
h2 { font-family: var(--f-display); font-weight: 500; font-size: calc(24px * var(--s)); margin: 0 0 10px; text-wrap: balance; }
.small { font-size: calc(13px * var(--s)); color: var(--muted); }
.muted { color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.error { background: var(--warm-soft); color: var(--warm); border-radius: 8px; padding: 12px 14px; font-size: calc(14px * var(--s)); }

.who-pick { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names button { border: 1px solid var(--line); background: var(--ground); color: var(--ink); font-size: calc(15px * var(--s)); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.names button:hover { border-color: var(--accent); }
.switch { border: 0; background: none; color: var(--accent); font-size: calc(14px * var(--s)); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.nav { display: flex; gap: 8px; }
.nav button { flex: 1 1 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.nav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }

.gist { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.gist li { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.gist li:last-child { border-bottom: 0; padding-bottom: 0; }
.gist .k { font-weight: 700; font-size: calc(14px * var(--s)); color: var(--accent); padding-top: 2px; }
.gist .v { min-width: 0; }
@media (max-width: 480px) { .gist li { grid-template-columns: 1fr; } }

.part { display: grid; gap: 14px; }
.part-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.part-head h2 { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: calc(13px * var(--s)); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.k-grouptask { --kc: var(--k-gt); }
.k-groupask { --kc: var(--k-ga); }
.k-individual { --kc: var(--k-in); }
.dot { background: var(--kc); }
.ask { --wc: var(--kc); position: relative; display: grid; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-left: 16px solid var(--wc); border-radius: 10px; padding: 26px 16px 16px 14px; }
.flag { position: absolute; top: -1px; right: 14px; background: var(--kc); color: var(--paper); font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .03em; padding: 4px 11px 5px; border-radius: 0 0 8px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.wsname { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 700; color: var(--ink); }
.wsname i { width: 12px; height: 12px; border-radius: 3px; background: var(--wc); display: inline-block; }
.wskey { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: calc(13px * var(--s)); }
.wskey span { display: inline-flex; align-items: center; gap: 6px; }
.wskey i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.people { display: grid; gap: 4px; margin: 0; padding: 8px 10px; background: var(--ground); border-radius: 8px; }
.person { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: calc(14px * var(--s)); }
.person .nm { font-weight: 600; min-width: 120px; }
.person .nt { color: var(--muted); font-size: calc(13px * var(--s)); }
.sum { font-weight: 700; font-size: calc(14px * var(--s)); }
.acts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.acts .btn { padding: 8px 14px; font-size: calc(14px * var(--s)); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; flex: 1; }
details.fold > summary .cnt { font-weight: 700; background: var(--accent); color: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: calc(14px * var(--s)); }
details.fold > summary::after { content: "Fold away \25B4"; color: var(--accent); font-weight: 600; font-size: calc(13px * var(--s)); white-space: nowrap; }
details.fold:not([open]) > summary::after { content: "Open \25BE"; }
details.fold > .fold-body { display: grid; gap: 14px; margin-top: 12px; }
.ready { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: calc(15px * var(--s)); background: var(--done-soft); color: var(--done); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.ready input { width: 20px; height: 20px; margin: 0; }
.batch { position: sticky; bottom: 12px; z-index: 3; background: var(--paper); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.busy { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; padding: 10px 12px; pointer-events: none; }
.busy .pill { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 18px; display: inline-flex; gap: 10px; align-items: center; font-weight: 600; font-size: calc(15px * var(--s)); box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: 100%; }
.busy .leaf { display: inline-block; transform-origin: 50% 90%; animation: sway 1s ease-in-out infinite; font-size: 1.3em; }
.busy .trail { position: absolute; top: 0; left: 0; height: 4px; width: 35%; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-20deg) scale(1); } 50% { transform: rotate(20deg) scale(1.2); } }
@keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .busy .leaf, .busy .trail { animation: none; } }
.kind { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--kc); }
.ask-text { font-size: calc(17px * var(--s)); font-weight: 500; }
.ask-meta { font-size: calc(14px * var(--s)); color: var(--muted); }
.ask-meta a { font-weight: 600; }
.ask-link { font-size: calc(14px * var(--s)); margin-top: 4px; }
.ask-link a { font-weight: 600; overflow-wrap: anywhere; }
.resp { display: flex; flex-wrap: wrap; gap: 8px; }
.resp button { border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: calc(14px * var(--s)); font-weight: 600; padding: 8px 13px; border-radius: 6px; cursor: pointer; }
.resp button:hover { border-color: var(--muted); }
.resp button:disabled { opacity: .5; cursor: wait; }
.answered { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: calc(14px * var(--s)); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.done { background: var(--done-soft); color: var(--done); }
.chip.team { background: var(--accent-soft); color: var(--accent); }
.chip.cant { background: var(--warm-soft); color: var(--warm); }
.chip.open { background: var(--quiet-soft); color: var(--quiet); }
.chip.query { background: var(--warm-soft); color: var(--warm); }
.chip.hold { background: var(--quiet-soft); color: var(--quiet); }
.ask.nudging { outline: 4px solid var(--warm); outline-offset: 2px; }
.ask.watching { border-left: 6px solid var(--quiet); }
.ask.pinned { outline: 3px solid var(--accent); outline-offset: 1px; }
.ask.pinned .ask-text { font-weight: 800; }
.tag { display: inline-block; font-size: calc(12px * var(--s)); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--warm); color: var(--paper); justify-self: start; }
.tag.pin { background: var(--accent); }
.snooze-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.snooze-row input[type=date] { font-size: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.resp button.ghosty { border-style: dashed; color: var(--muted); font-weight: 500; }
.note { font-size: calc(14px * var(--s)); color: var(--muted); margin: 0; }
.stack { display: grid; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline input { flex: 1 1 200px; min-width: 0; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.optional { font-size: calc(13px * var(--s)); color: var(--muted); font-style: italic; font-weight: 400; }
.none { color: var(--muted); }
.extras { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 8px; }
.extras details summary { cursor: pointer; font-size: calc(13px * var(--s)); font-weight: 600; color: var(--muted); }
.who-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.who-list .chip { font-weight: 500; }
.suggest { background: var(--ground); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.pickchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pickchips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: calc(14px * var(--s)); cursor: pointer; }
.pickchips input { margin: 0; }
.suggest textarea { width: 100%; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }

details.talk { border-top: 1px solid var(--line); padding-block: 12px; }
details.talk:last-of-type { border-bottom: 1px solid var(--line); }
details.talk summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.talk summary::-webkit-details-marker { display: none; }
details.talk summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details.talk[open] summary::after { content: "–"; }
details.talk p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }

.bar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; font-size: calc(14px * var(--s)); }
.track { height: 8px; background: var(--quiet-soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.btn { display: inline-block; background: var(--accent); color: var(--paper); font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 6px; border: 0; cursor: pointer; font-size: calc(15px * var(--s)); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:disabled { opacity: .6; cursor: wait; }

/* add page */
.addrow { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab, legend { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field textarea, .field input[type="date"], .field select { width: 100%; font-size: calc(15px * var(--s)); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.toggle button { border: 0; background: var(--ground); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 9px 18px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.plus { border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-size: calc(15px * var(--s)); font-weight: 700; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.radio { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.radio label { display: inline-flex; align-items: center; gap: 8px; font-size: calc(15px * var(--s)); }

/* PM */
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { flex: 1 1 130px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-size: calc(26px * var(--s)); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: calc(13px * var(--s)); color: var(--muted); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.q { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q label { font-size: calc(12px * var(--s)); font-weight: 600; color: var(--muted); }
.q textarea, .q input, .q select { width: 100%; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.q .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
@media (max-width: 520px) { .q .row2 { grid-template-columns: 1fr; } }
.check { font-size: calc(13px * var(--s)); color: var(--warm); background: var(--warm-soft); border-radius: 6px; padding: 6px 10px; }
.table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: calc(14px * var(--s)); }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: calc(12px * var(--s)); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td .chips { display: flex; flex-wrap: wrap; gap: 4px; }
pre.copy { margin: 0; white-space: pre-wrap; font-family: var(--f-body); font-size: calc(14px * var(--s)); background: var(--ground); border-radius: 6px; padding: 12px; }
.owners { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.owner { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--ink); font-size: calc(14px * var(--s)); padding: 3px 3px 3px 10px; border-radius: 999px; }
.owner button { border: 0; background: none; color: var(--muted); font-size: calc(16px * var(--s)); line-height: 1; cursor: pointer; padding: 3px 7px; border-radius: 999px; }
.owners select { width: auto; font-size: calc(14px * var(--s)); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: calc(14px * var(--s)); max-width: calc(100% - 32px); z-index: 10; }

.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.tools button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; min-width: 44px; min-height: 40px; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
.tools button:disabled { opacity: .4; cursor: default; }

/* share / QR */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,11,.6); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.modal { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); margin: auto; }
.modal h2 { margin: 0; }
.modal .qr { background: #fff; border-radius: 10px; padding: 8px; width: min(100%, 260px); margin: 0 auto; line-height: 0; }
.modal .qr svg { width: 100%; height: auto; display: block; }
.modal .linkline { font-size: calc(13px * var(--s)); overflow-wrap: anywhere; text-align: center; margin: 0; color: var(--muted); }
.modal .app-note { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: calc(14px * var(--s)); display: grid; gap: 6px; }
.modal .app-note ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.modal .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* one-card-at-a-time deck */
.view-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.view-row .toggle button { padding: 7px 14px; font-size: calc(14px * var(--s)); }
.deck { display: grid; gap: 10px; }
.deck-track { display: flex; align-items: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; border-radius: 10px; }
.deck-track::-webkit-scrollbar { display: none; }
.deck-slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; padding: 0 1px; }
.deck-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.deck-nav button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; min-width: 96px; }
.deck-nav button:disabled { opacity: .4; cursor: default; }
.deck-count { font-weight: 700; font-size: calc(14px * var(--s)); font-variant-numeric: tabular-nums; }
.deck-hint { text-align: center; margin: 0; }
.deck-dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.deck-dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
.deck-dots button[aria-current="true"] { background: var(--accent); transform: scale(1.3); }

/* PM: briefing editor */
.bf { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.bf-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.bf-head h3 { font-family: var(--f-display); font-weight: 500; font-size: calc(20px * var(--s)); margin: 0; }
.bf-list { display: grid; gap: 10px; }
.bf-list > .lab { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.bf-row { display: grid; gap: 6px; background: var(--ground); border-radius: 8px; padding: 10px; }
.bf-row input, .bf-row textarea, .bf-link input { width: 100%; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.bf-link { display: grid; gap: 6px; }
.bf-link > label { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* icons */
.ico { display: inline-flex; vertical-align: middle; line-height: 0; }
.ico svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.flag .ico svg { width: 1.9em; height: 1.45em; }
.nav button .ico svg { width: 1.5em; height: 1.5em; }
.deck-nav button .ico svg { width: 1.5em; height: 1.5em; }
.toggle button .ico svg { width: 1.35em; height: 1.35em; }
.tools button .ico svg { width: 1.35em; height: 1.35em; }
.chip .ico svg { width: 1.15em; height: 1.15em; }
/* tasks and asks share one colour; asks are lighter */
.k-grouptask, .k-groupask, .k-individual { --kc: var(--k-gt); }
.k-groupask .flag { opacity: .55; }
/* sections: chevron instead of words */
details.fold > summary::after { content: ""; display: inline-block; width: .55em; height: .55em; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-135deg); margin: 0 6px 0 0; font-size: calc(16px * var(--s)); }
details.fold:not([open]) > summary::after { content: ""; transform: rotate(45deg); }
:root[data-labels="words"] details.fold > summary::after { content: "Fold away \25B4"; width: auto; height: auto; border: 0; transform: none; margin: 0; color: var(--accent); font-weight: 600; font-size: calc(13px * var(--s)); white-space: nowrap; }
:root[data-labels="words"] details.fold:not([open]) > summary::after { content: "Open \25BE"; transform: none; }
.tools button .ico + * { margin-left: 4px; }
details.pfold > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 700; font-size: calc(14px * var(--s)); background: var(--ground); }
details.pfold > summary::-webkit-details-marker { display: none; }
details.pfold > summary::after { content: ""; width: .5em; height: .5em; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-135deg); }
details.pfold:not([open]) > summary::after { transform: rotate(45deg); }
details.pfold[open] > summary { margin-bottom: 8px; }
.infobtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px; border-radius: 50%; justify-self: start; }
.infobtn[aria-expanded="true"] { background: var(--accent-soft); }
.infobtn .ico svg { width: 1.5em; height: 1.5em; }
.ico-label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* system map (optional/SystemMap.gs, PM only). The drawing's own styles live in Map.html */
.wide { max-width: 860px; }
.map-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.map-ctl button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(14px * var(--s)); font-weight: 600; min-height: 40px; padding: 4px 14px; border-radius: 8px; cursor: pointer; }
.map-ctl button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.map-ctl label { font-size: calc(14px * var(--s)); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sysmap .scroll { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.sysmap svg { display: block; width: 100%; min-width: 640px; height: auto; }
/* meeting agenda */
.agtop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.agbtn { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; font-size: calc(14px * var(--s)); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.agbtn:hover { background: var(--accent-soft); }
.agbtn.pri { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.agbtn.pri:hover { filter: brightness(1.08); }
.agbtn.dng { border-color: var(--warm); color: var(--warm); }
.agbtn.sm { padding: 3px 10px; font-size: calc(13px * var(--s)); border-width: 1.5px; }
.agi { border: 1.5px solid var(--muted); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 2px 8px; font-size: calc(13px * var(--s)); font-weight: 600; cursor: pointer; white-space: nowrap; }
.agi:hover:not(:disabled) { border-color: var(--ink); background: var(--accent-soft); }
.agi:disabled { opacity: .35; cursor: default; }
.agb { --bc: var(--accent); --bi: var(--paper); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.agh { width: 100%; display: flex; gap: 12px; align-items: center; background: var(--bc); color: var(--bi); border: 0; padding: 14px 16px; font: inherit; font-weight: 700; font-size: calc(19px * var(--s)); text-align: left; cursor: pointer; }
.agh:hover { filter: brightness(1.08); }
.agsub { font-size: calc(14px * var(--s)); font-weight: 500; margin-left: 8px; opacity: .92; }
.agchev { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.3); font-size: calc(24px * var(--s)); padding-bottom: 2px; line-height: 1; }
.agpm { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; font-size: calc(17px * var(--s)); font-weight: 700; line-height: 1; }
.agbody { display: grid; margin: 12px 16px 16px 22px; padding-left: 16px; border-left: 4px solid var(--bc); }
.agr { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.agl { flex: 0 0 130px; font-size: calc(13px * var(--s)); font-weight: 700; color: var(--muted); padding-top: 7px; }
.agr > .aglabin { flex: 0 0 130px; width: 130px; font-weight: 700; color: var(--muted); font-size: calc(13px * var(--s)); }
.agcell { flex: 1 1 200px; min-width: 0; border: 0; border-bottom: 1.5px solid transparent; background: transparent; color: var(--ink); font: inherit; resize: none; padding: 5px 4px; line-height: 1.4; border-radius: 0; overflow: hidden; }
.agcell:hover { background: var(--ground); }
.agcell:focus { outline: none; border-bottom-color: var(--accent); background: var(--ground); }
.agdim { opacity: .5; }
.aglk { color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 11px; font-size: calc(13px * var(--s)); font-weight: 600; text-decoration: none; white-space: nowrap; }
.aglkwrap { display: inline-flex; gap: 4px; align-items: center; }
.aglinkin { width: 180px; font-size: calc(14px * var(--s)); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.agmeet input[type=date] { font: inherit; font-size: calc(14px * var(--s)); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.agmeet .agcell { flex: 1 1 180px; border-bottom-color: var(--line); }
.agchips { display: flex; flex-wrap: wrap; gap: 6px; }
.agchip { border: 1.5px solid var(--muted); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 13px; font: inherit; font-size: calc(14px * var(--s)); cursor: pointer; }
.agchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
.agchip.warm[aria-pressed="true"] { background: var(--warm); border-color: var(--warm); }
.agfold { display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; padding: 4px 0; text-align: left; }
.agtasks { padding: 8px 0; border-top: 1px dashed var(--line); display: grid; gap: 4px; }
.agtaskbox { margin-left: 22px; border-top: 1px dashed var(--line); padding: 6px 0; display: grid; gap: 6px; }
.agtask { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.agtasktext { flex: 1 1 200px; }
.agtag { background: var(--warm-soft); color: var(--warm); font-size: calc(12px * var(--s)); font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.agnote { width: 100%; font: inherit; font-size: calc(14px * var(--s)); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.agask { border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: grid; gap: 8px; }
.agaskhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.agaskhead .agfold { flex: 1 1 160px; }
.agaskbody { display: grid; gap: 4px; padding-left: 22px; }
.agform .field textarea, .agform .field select, .agform .field input { width: 100%; font-size: calc(15px * var(--s)); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.agbtns { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.agask .agbtns { border-top: 0; padding-top: 4px; }
.agdone { background: var(--done-soft); color: var(--done); border-radius: 10px; padding: 12px 16px; font-weight: 600; }
.agdone a { color: inherit; }
@media (max-width: 520px) { .agl, .agr > .aglabin { flex-basis: 100%; padding-top: 0; } }
</style>
</head>

        err => { renderMember(); fail(err); });
    } });
    box.push(el('div', { class: 'suggest' }, [
      el('strong', { text: t('suggest_h') }),

    ]));
  }
  return kids.length || box.length ? el('div', { class: 'stack' }, [kids.length ? el('div', { class: 'extras' }, kids) : '', ...box]) : '';
}

function send(id, status, note, btn) {

}

try { pmSort = localStorage.getItem(PFX + 'PmSort') || 'default'; } catch (e) {}
const SORTS_ALL = [['default', 'As raised'], ['due', 'Due date'], ['area', 'Project area'], ['kind', 'Task / ask / one person']];

function sortList(list, d) {
  const KO = { grouptask: 0, individual: 1, groupask: 2 };
  const key = a => pmSort === 'due' ? (a.byIso || '')
    : pmSort === 'area' ? ((d.workstreams || []).indexOf(a.section) < 0 ? '' : String((d.workstreams || []).indexOf(a.section)).padStart(3, '0'))
    : pmSort === 'kind' ? String(KO[a.kind] == null ? 9 : KO[a.kind]) : '0';
  return orderBy(list, key, pmRev);
}
const pmFold = { brief: false, held: false, watch: false, current: false, backlog: false, done: false, snoozed: false };

/** One editable ask card. opts: okLabel, okToast, dropLabel, ready (tick box instead of a save button), onCancel. */
function pmEditCard(x, d, opts) {
  const owners = ownerPicker(x.id, x.forText, d.names);
  const fBy = el('input', { id: 'by-' + x.id, value: x.by, placeholder: 'e.g. 20 Oct' });
  const fMode = el('select', { id: 'mode-' + x.id }, [['', 'Automatic'], ['Everyone', 'Task: everyone listed must do it'], ['Invite', 'Ask: invite people, I say when it is enough']].map(v => el('option', { value: v[0], text: v[1] })));
  fMode.value = x.mode;
  const fKind = el('select', { id: 'kind-' + x.id }, [['task', 'Task'], ['ask', 'Ask']].map(v => el('option', { value: v[0], text: v[1] })));
  fKind.value = x.askKind || 'task';
  const fWs = el('select', { id: 'ws-' + x.id }, [el('option', { value: '', text: 'Not placed yet' })].concat((d.workstreams || []).map(w => el('option', { value: w, text: w }))));
  fWs.value = (d.workstreams || []).indexOf(x.section) >= 0 ? x.section : '';
  const fTarget = el('input', { id: 'tg-' + x.id, type: 'number', min: '1', value: x.target, placeholder: 'Enough at', 'aria-label': 'Enough at' });
  const fGreat = el('input', { id: 'gr-' + x.id, type: 'number', min: '1', value: x.great, placeholder: 'Great at', 'aria-label': 'Great at' });
  const invite = el('div', { class: 'inline', style: 'margin-top:6px' }, [fTarget, fGreat]);
  const showInvite = () => { invite.style.display = fMode.value === 'Invite' ? '' : 'none'; };
  fMode.addEventListener('change', showInvite); showInvite();
  const fAsk = el('textarea', { id: 'ask-' + x.id, rows: 3 });
  fAsk.value = x.ask;
  const fLink = el('input', { id: 'link-' + x.id, type: 'url', value: x.link || '', placeholder: 'https://…' });
  const fLinkText = el('input', { id: 'lt-' + x.id, type: 'text', value: x.linkText || '', maxlength: '80', placeholder: 'Label, e.g. Draft pack' });
  // Same order the server's pmConfirm expects after (key, id).
  const args = () => [owners.value(), fBy.value, fAsk.value, fMode.value, fTarget.value, fGreat.value, fWs.value, fLinkText.value, fLink.value, fKind.value];
  collectors[x.id] = args;
  const drop = el('button', { class: 'switch', type: 'button', text: opts.dropLabel });
  const all = [drop];
  let ok;
  if (opts.ready) {
    const cb = el('input', { type: 'checkbox', id: 'ready-' + x.id });
    cb.checked = !!readySet[x.id];
    cb.addEventListener('change', () => { readySet[x.id] = cb.checked; updateBatch(); });
    ok = el('label', { class: 'ready', for: 'ready-' + x.id }, [cb, 'Ready']);
  } else {
    ok = el('button', { class: 'btn', type: 'button', text: opts.okLabel });
    all.push(ok);
    ok.addEventListener('click', () => {
      if (busy) return;
      all.forEach(b => { b.disabled = true; }); ok.textContent = 'Saving…';
      call('pmConfirm', [PM_KEY, x.id].concat(args()), r => { delete editing[x.id]; data = r; renderPm(); toast(opts.okToast); },
        e => { all.forEach(b => { b.disabled = false; }); ok.textContent = opts.okLabel; fail(e); });
    });
  }
  drop.addEventListener('click', () => {
    if (busy) return;
    if (!window.confirm('Remove this ask completely? It comes off everyone’s list.')) return;
    all.forEach(b => { b.disabled = true; }); drop.textContent = 'Removing…';
    call('pmDiscard', [PM_KEY, x.id], r => { delete editing[x.id]; delete readySet[x.id]; data = r; renderPm(); toast('Removed.'); },
      e => { all.forEach(b => { b.disabled = false; }); drop.textContent = opts.dropLabel; fail(e); });
  });
  const cancel = opts.onCancel ? el('button', { class: 'switch', type: 'button', text: 'Cancel', onclick: opts.onCancel }) : '';
  return el('div', { class: 'q' }, [
    el('div', { class: 'small', text: x.source }),
    x.check ? el('div', { class: 'check', text: x.check }) : '',
    x.needsWs && !x.check ? el('div', { class: 'check', text: 'Needs a project area before it can land on the dashboard.' }) : '',
    el('label', { for: 'ask-' + x.id, text: 'Ask' }), fAsk,
    el('div', { class: 'row2' }, [
      el('div', {}, [el('label', { for: 'add-' + x.id, text: 'For' }), owners.el]),
      el('div', {}, [el('label', { for: 'by-' + x.id, text: 'By' }), fBy]),
    ]),
    el('div', { class: 'row2' }, [
      hasWs() ? el('div', {}, [el('label', { for: 'ws-' + x.id, text: 'Project area' }), fWs]) : '',
      el('div', {}, [el('label', { for: 'kind-' + x.id, text: 'Is it a…' }), fKind]),
    ]),
    el('div', {}, [el('label', { for: 'mode-' + x.id, text: 'How many need to act?' }), fMode, invite]),
    el('div', { class: 'row2' }, [
      el('div', {}, [el('label', { for: 'link-' + x.id, text: 'Link (optional)' }), fLink]),
      el('div', {}, [el('label', { for: 'lt-' + x.id, text: 'Link label' }), fLinkText]),
    ]),
    el('div', { class: 'inline' }, [ok, cancel, drop]),
  ]);
}

  }

  // optional/Decisions.gs: decisions from "Where we landed" wait here for Major / Minor / Remove
  if (d.decisions && d.decisions.length) {
    const dc = el('section', { class: 'card' }, [el('h2', { text: 'Decisions to sort (' + d.decisions.length + ')' }),

      fWhere.value = x.section;
      const major = el('button', { class: 'btn', type: 'button', text: 'Major' });
      const minor = el('button', { class: 'btn ghost', type: 'button', text: 'Minor' });
      const gone = el('button', { class: 'switch', type: 'button', text: 'Remove' });
      const all = [major, minor, gone];
      const reset = () => { all.forEach(b => { b.disabled = false; }); major.textContent = 'Major'; minor.textContent = 'Minor'; gone.textContent = 'Remove'; };
      const go = (b, verdict, msg) => () => {

      };

      gone.addEventListener('click', go(gone, 'remove', 'Removed.'));
      dc.append(el('div', { class: 'q' }, [
        el('div', { class: 'small', text: x.meeting + ' meeting' }),
        el('div', {}, [el('label', { for: 'dl-' + x.id, text: 'Label' }), fLabel]),
        el('div', {}, [el('label', { for: 'dt-' + x.id, text: 'Decision' }), fText]),
        el('div', {}, [el('label', { for: 'dw-' + x.id, text: 'Where' }), fWhere]),
        el('div', { class: 'inline' }, [major, minor, gone]),
      ]));
    });
    kids.push(dc);
  }

  kids.push(briefSection());
  if (d.standInOn && !d.standIn) kids.push(standInSection());

  // To review: nudges first (outlined), then asks to check. Tick "Ready" on each checked ask, then publish the lot in one go.
  const nudged = sortList(d.list.filter(a => a.nudging && a.bucket !== 'done'), d);
  const heldKids = [];
  if (!d.queue.length && !nudged.length) heldKids.push(el('p', { class: 'none', style: 'margin:0', text: 'Nothing to review. New asks and nudges show up here.' }));
  nudged.forEach(a => heldKids.push(pmAskCard(a, d)));
  d.queue.forEach(x => heldKids.push(el('div', { class: 'ask k-' + x.kind, style: wsStyle(x.section) }, [
    el('div', { class: 'flag', title: (x.live ? 'Live, not yet checked' : 'Held back') + ' · ' + (KIND_PM[x.kind] || ''), 'aria-label': (x.live ? 'Live, not yet checked' : 'Held back') + ' · ' + (KIND_PM[x.kind] || '') }, [x.live ? 'Live, check ' : 'Held back ', kindIcon(x.kind)]),
    pmEditCard(x, d, { ready: true, dropLabel: 'Remove it' }),
  ])));
  kids.push(foldSection('held', 'To review', d.queue.length + nudged.length, heldKids, (d.queue.length ? 'Asks held back, and asks that went live without a review tick. Correct anything that needs it and tick “Ready”, then press the button at the bottom once. ' : '') + (nudged.length ? 'Outlined cards are nudges: due soon or still waiting. Edit one, pin it to the top of their list, or reach out privately. Then move it to the watch list, or return it to where it came from.' : '')));
  if (d.queue.length) kids.push(el('div', { class: 'batch', id: 'batchbar' }, [el('button', { class: 'btn', type: 'button', onclick: publishReady })]));

  if (d.cants.length) {
    const cc = el('section', { class: 'card' }, [el('h2', { text: t('pm_cants_h') + ' (' + d.cants.length + ')' }),
      el('p', { class: 'small', style: 'margin:0', text: 'Ask again keeps it on their list for the next meeting. Snooze hides it from you until the date you pick. ' + (d.backburner ? 'Back burner counts it as done for now, so you can pull it back later. ' : '') + 'Drop records it as dropped on the dashboard and takes it off everyone’s list.' })]);
    d.cants.forEach(x => {
      const again = el('button', { class: 'btn', type: 'button', text: t('pm_again') });
      const snooze = el('button', { class: 'btn ghost', type: 'button', text: 'Snooze until' });

      const all = [again, snooze].concat(d.backburner ? [burner] : [], [drop]);
      const labels = all.map(b => b.textContent);
      const lock = b => { if (busy) return false; all.forEach(z => { z.disabled = true; }); b.textContent = t('saving'); return true; };
      const unlock = e => { all.forEach((z, i) => { z.disabled = false; z.textContent = labels[i]; }); fail(e); };
      again.addEventListener('click', () => { if (lock(again)) call('pmCarry', [PM_KEY, x.id, x.scope], r => { data = r; renderPm(); toast(t('pm_again_toast')); }, unlock); });
      snooze.addEventListener('click', () => { if (!when.value) { fail(new Error('Pick the date it should come back.')); return; } if (lock(snooze)) call('pmHold', [PM_KEY, x.id, 'snooze', when.value], r => { data = r; renderPm(); toast('Snoozed. It comes back after that date.'); }, unlock); });
      burner.addEventListener('click', () => { if (lock(burner)) call('pmHold', [PM_KEY, x.id, 'backburner'], r => { data = r; renderPm(); toast('On the back burner. It counts as done for now.'); }, unlock); });
      drop.addEventListener('click', () => { if (lock(drop)) call('pmHold', [PM_KEY, x.id, 'drop'], r => { data = r; renderPm(); toast('Dropped. It stays on the dashboard, marked as dropped.'); }, unlock); });
      cc.append(el('div', { class: 'q' }, [
        el('div', { class: 'small', text: x.source + ' · ' + x.scope + (x.by && x.by !== x.scope ? ' (answered by ' + x.by + ')' : '') }),
        el('div', { text: x.ask }),
        el('div', { class: 'snooze-row' }, [again, snooze, when].concat(d.backburner ? [burner] : [], [drop])),
      ]));
    });
    kids.push(cc);
  }

  const by = b => sortList(d.list.filter(a => a.bucket === b), d);
  const cur = by('current'), back = by('backlog'), dn = by('done'), snz = by('snoozed'), wat = by('watch');
  const none = txt => el('p', { class: 'none', style: 'margin:0', text: txt });
  kids.push(foldSection('watch', 'Watch list', wat.length, wat.length ? wat.map(a => pmAskCard(a, d)) : [none('Nothing on the watch list.')],
    'Nudges you have looked at and are keeping an eye on. They stay here until they are done, or until you return them to Current or Backlog.'));
  kids.push(foldSection('current', 'Current asks', cur.length, cur.length ? cur.map(a => pmAskCard(a, d)) : [none('Nothing open from the latest meeting.')],
    'Raised at or since the last meeting that has passed, and not finished yet. Everyone invited is listed with what they have done.'));
  kids.push(foldSection('backlog', 'Backlog asks', back.length, back.length ? back.map(a => pmAskCard(a, d)) : [none('Nothing is hanging over from earlier meetings.')],
    d.hasBacklogRow ? 'Still open from earlier meetings. They are listed in the BACKLOG row for ' + (d.nextMeeting || 'the next meeting') + '. “Put on the next agenda” adds a copy to that meeting, marked as a nudge.' : d.dashOn ? 'Add a row labelled “BACKLOG (still open)” at the bottom of the ' + d.trackerTab + ' tab and these will be listed there for the next meeting.' : 'Still open from earlier meetings.'));
  kids.push(foldSection('done', 'Done', dn.length, dn.length ? dn.map(a => pmAskCard(a, d)) : [none('Nothing finished yet.')],
    'Finished asks and tasks, plus anything dropped or on the back burner (marked on the card). You can still edit or bring any of them back.'));
  if (snz.length) kids.push(foldSection('snoozed', 'Snoozed', snz.length, snz.map(a => pmAskCard(a, d)), 'Hidden from your lists until the date shown, then they come back on their own.'));


  kids.push(el('section', { class: 'card' }, [el('h2', { text: 'Opener for the next meeting' }), el('pre', { class: 'copy', text: d.opener })]));
  kids.push(el('section', { class: 'inline' }, [
    el('a', { class: 'btn ghost', href: memberUrl(), text: 'Member briefing' }),
    el('a', { class: 'btn ghost', href: addUrl(), text: 'Add asks page' }),
    d.map ? el('a', { class: 'btn ghost', href: mapUrl(), text: 'System map' }) : '',
    d.dashboardUrl ? el('a', { class: 'btn ghost', href: d.dashboardUrl, target: '_blank', rel: 'noopener', text: 'Dashboard' }) : '',
  ]));
  app.replaceChildren(...kids);
  updateBatch();
}

/* ------------------------------------------------ meeting agenda (optional/Agenda.gs) */
let ag = null, agPoll = null, agPreview = false, agPubArmed = false, agResult = null, agVer = 0, agFocus = '';

let agCol = {};
try { agCol = JSON.parse(localStorage.getItem(PFX + 'AgCol') || '{}') || {}; } catch (e) {}

/** A call that shows no loading pill: used for autosave and refresh. */
function qcall(fn, args, ok, bad) {
  const good = r => { if (ok) ok(r); };
  const oops = e => { if (bad) bad(e); else toast((e && e.message) || 'Could not save. Check your connection.'); };
  if (!API) { google.script.run.withSuccessHandler(good).withFailureHandler(oops)[fn].apply(null, args || []); return; }
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(r => r.json())
    .then(res => { if (!res || res.ok !== true) throw new Error((res && res.error) || 'Something went wrong.'); good(res.result); })
    .catch(oops);
}
// Edits go to the server one at a time, in order, so "add" always lands before the "set" that follows it.
const agQ = [];
let agRun = false;
const agBusy = () => agRun || agQ.length > 0 || Object.keys(agTO).length > 0;
function agStatus() { const n = document.getElementById('ag-save'); if (n) n.textContent = agBusy() ? 'Saving…' : 'All saved'; }
function agOp(op, ok, bad) { agQ.push([op, ok, bad]); agStatus(); agPump(); }
function agPump() {
  if (agRun || !agQ.length) return;
  agRun = true;
  const job = agQ.shift();
  const next = () => { agRun = false; agStatus(); agPump(); };
  qcall('agendaOp', [getMe(), PM_KEY, job[0]], r => { if (job[1]) job[1](r); next(); }, e => { if (job[2]) job[2](e); else toast((e && e.message) || 'Could not save.'); next(); });
}
const agItem = id => ag && ag.items ? ag.items.find(x => x.id === id) : null;
const agRO = () => ag.state === 'published';
const agIsPm = () => ag.pm && !agPreview;
const agUnits = () => ag.blocks || ag.groups;   // groups, or workstreams when AGENDA_BLOCKS = workstreams
const agBlocksList = () => ['open', 'proj'].concat(agUnits(), ['park']);
const agBlockName = id => id === 'meet' ? 'Meeting dates and chairs' : id === 'open' ? 'Opening' : id === 'proj' ? 'Project update' : id === 'park' ? 'Doesn’t have a place yet' : id;
function agShort(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return String(u).slice(0, 24); } }
function agNewId() { const b = new Uint8Array(4); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); }); return 'G' + Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(''); }
function agWhereFor(block, cur) {
  if (agUnits().indexOf(block) >= 0) return block;
  if (block === 'proj') return cur && ag.workstreams.indexOf(cur) >= 0 && agUnits().indexOf(cur) < 0 ? cur : 'Not sure';
  return 'Not sure';
}

/** Change one field of one row: shown at once, saved shortly after you stop typing. */
function agEdit(id, field, value, now) {
  const it = agItem(id);
  if (!it) return;
  it[field] = value;
  const v = ++agVer;
  (agDirty[id] = agDirty[id] || {})[field] = v;
  const key = id + field;
  clearTimeout(agTO[key]);
  const clear = () => { if (agDirty[id] && agDirty[id][field] === v) delete agDirty[id][field]; };
  const send = () => {
    delete agTO[key];
    const f = {}; f[field] = (agItem(id) || {})[field];
    agOp({ t: 'set', id: id, f: f }, clear, e => { clear(); toast((e && e.message) || 'Could not save that.'); });
  };
  if (now) send(); else { agTO[key] = setTimeout(send, 700); agStatus(); }
}
function agNoteEdit(askId, text) {
  ag.notes[askId] = text;
  const bar = document.getElementById('ag-bar'); if (bar) bar.textContent = agBarText();
  const v = ++agVer;
  agDirtyN[askId] = v;
  const key = 'n' + askId;
  clearTimeout(agTO[key]);
  const clear = () => { if (agDirtyN[askId] === v) delete agDirtyN[askId]; };
  agTO[key] = setTimeout(() => { delete agTO[key]; agOp({ t: 'note', askId: askId, text: ag.notes[askId] || '' }, clear, clear); }, 700);
  agStatus();
}
function agAdd(block, kind) {
  const id = agNewId();
  const it = { id: id, block: block, kind: kind, text: '', link: '', label: kind === 'line' ? 'New line' : '', hidden: false, from: ag.me, to: '', where: kind === 'ask' ? agWhereFor(block, '') : '', by: '', askKind: 'task', ready: false, _new: true };
  ag.items.push(it);
  if (kind === 'ask') agAskOpen[id] = true;
  agFocus = (kind === 'ask' ? 'ag-a-' : 'ag-t-') + id;
  renderAgenda();
  agOp({ t: 'add', id: id, block: block, kind: kind }, () => { it._new = false; }, e => { ag.items = ag.items.filter(x => x.id !== id); renderAgenda(); toast((e && e.message) || 'Could not add that.'); });
}
function agDel(id) {
  agGone[id] = true;
  ag.items = ag.items.filter(x => x.id !== id);
  agOp({ t: 'del', id: id });
  renderAgenda();
}
function agMove(id, dir) {
  const it = agItem(id);
  if (!it) return;
  const L = agBlocksList(), i = L.indexOf(it.block) + dir;
  if (i < 0 || i >= L.length) return;
  it.block = L[i];
  if (it.kind === 'ask') it.where = agWhereFor(it.block, it.where);
  agOp({ t: 'move', id: id, block: it.block });

function agToggle(kind, name) {

  ag[kind] = ag[kind].filter(x => x !== name);
  if (on) { ag[kind].push(name); ag[other] = ag[other].filter(x => x !== name); }
  agOp({ t: 'meta', f: kind, v: name, on: on });
  renderAgenda();
}
function agSetState(v) { ag.state = v; agPubArmed = false; agResult = null; agOp({ t: 'state', v: v }); renderAgenda(); }

/* ---- small pieces */
function agBtn(text, onclick, cls, extra) { return el('button', Object.assign({ type: 'button', class: 'agbtn' + (cls ? ' ' + cls : ''), text: text, onclick: onclick }, extra || {})); }
function agMini(text, label, onclick, disabled) { return el('button', { type: 'button', class: 'agi', 'aria-label': label, title: label, text: text, disabled: disabled || false, onclick: onclick }); }
function agArrows(it) {

function agLinkCtl(it) {

function agItemRow(it) {

}

}

      agRO() ? '' : agBtn(showNote ? 'Hide note' : 'Add note', () => { agNoteOpen[t.id] = !showNote; renderAgenda(); }, 'sm'),

/* ---- asks */
function agAskCard(it) {

function agAskForm(it) {

/* ---- meeting dates and chairs (PM only; they live on the tracker's date row) */

/* ---- blocks */

    }

      const on = ag[kind].indexOf(p.name) >= 0, can = !agRO() && (kind === 'apol' ? pm : (pm || p.name === ag.me));
      return el('button', { type: 'button', class: 'agchip' + (kind === 'apol' ? ' warm' : ''), 'aria-pressed': String(on), onclick: () => { if (can) agToggle(kind, p.name); }, style: can ? '' : 'cursor:default', text: p.display + (kind === 'present' && p.name === ag.me ? ' (you)' : '') });
    });

    k.push(el('div', { class: 'agr' }, [el('span', { class: 'agl', text: 'Apologies' }), el('div', {}, [el('div', { class: 'agchips' }, chips('apol')), el('div', { class: 'small', text: pm ? 'Chair: tap a name to record an apology.' : 'The chair adds apologies.' })])]));
    k.push(el('div', { class: 'agr' }, [el('span', { class: 'agl', text: 'Minutes and agenda' }),
      el('button', { type: 'button', class: 'agchip', 'aria-pressed': String(ag.minutesOk), style: pm && !agRO() ? '' : 'cursor:default', text: ag.minutesOk ? 'Confirmed' : (pm ? 'Tap to confirm' : 'Not yet confirmed'), onclick: () => { if (pm && !agRO()) { ag.minutesOk = !ag.minutesOk; agOp({ t: 'meta', f: 'minutes', v: ag.minutesOk }); renderAgenda(); } } }),
      ag.minutesLink ? el('a', { class: 'aglk', href: ag.minutesLink, target: '_blank', rel: 'noopener', text: 'Last meeting’s minutes ↗' }) : '']));
    k.push(el('div', { class: 'agr' }, [el('span', { class: 'agl', text: 'Lightning updates' }), el('span', { class: 'small', style: 'padding-top:6px', text: 'Go round the room: what has everyone been up to? Add an item or an ask below if something comes out of it.' })]));
  }
  if (id === 'proj') {

    if (pm && !agRO()) k.push(el('div', { class: 'agr' }, [agBtn('+ Add a line', () => agAdd('proj', 'line'), 'sm'), el('span', { class: 'small', text: 'PM only. Hide a line in a month with nothing to say; members won’t see it.' })]));
    k.push(agTasksRow('proj', 'Outstanding items'));

function agColour(id) {

  return WS_COLOURS[(i < 0 ? agUnits().indexOf(id) : i) % WS_COLOURS.length];
}
function agInk(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? '#15211c' : '#ffffff'; }   // amber/yellow get dark text
function agBlock(id) {

    [el('span', { class: 'agchev', 'aria-hidden': 'true', text: col ? '▸' : '▾' }), el('span', {}, [agBlockName(id), el('span', { class: 'agsub', text: sub })])]);

function agBarText() {
  const asks = ag.items.filter(x => x.kind === 'ask'), ready = asks.filter(x => x.ready).length, left = asks.length - ready;
  const notes = Object.keys(ag.notes).filter(k => String(ag.notes[k] || '').trim()).length;
  return ready + ' ask' + (ready === 1 ? '' : 's') + ' and ' + notes + ' note' + (notes === 1 ? '' : 's') + ' ready' + (left ? ' · ' + left + ' unfinished (left out)' : '');
}
function agPublish() {
  if (agBusy()) { toast('Still saving. Try again in a moment.'); return; }
  call('agendaPublish', [PM_KEY], r => { agResult = r; agPubArmed = false; ag.state = 'published'; renderAgenda(); },
    e => { agPubArmed = false; fail(e); renderAgenda(); });
}
function renderAgenda() {
  if (!ag) return;
  const kids = [];
  if (MODE !== 'pm') kids.push(navBar());
  const pm = agIsPm(), draft = ag.state === 'draft';
  const state = ag.state === 'published' ? 'Published and closed' : draft ? (ag.pm ? 'Draft: only you can see this' : 'Not open yet') : 'Open: everyone can add and edit';
  kids.push(el('header', {}, [el('div', { class: 'eyebrow', text: ORG + ' · meeting agenda' }), el('h1', {}, ['Meeting ', el('em', { text: 'agenda' })]),
    el('p', { class: 'small', style: 'margin:8px 0 0', text: ag.meetingLabel + ' · ' + state })]));
  const top = [];
  if (ag.pm) top.push(agBtn(agPreview ? 'Back to PM view' : 'Preview as member', () => { agPreview = !agPreview; renderAgenda(); }));
  if (pm && ag.state === 'published') top.push(agBtn('Reopen for editing', () => agSetState('shared'), 'pri'));
  else if (pm) top.push(agBtn(draft ? 'Share with the team' : 'Back to draft', () => agSetState(draft ? 'shared' : 'draft'), draft ? 'pri' : ''));
  if (top.length || ag.items) top.push(el('span', { class: 'small', id: 'ag-save', text: agBusy() ? 'Saving…' : 'All saved' }));
  kids.push(el('div', { class: 'agtop' }, top));

    kids.push(el('div', { class: 'agdone' }, r && ag.pm ? ['Published. ', r.asks + ' ask' + (r.asks === 1 ? '' : 's') + ' sent to your queue, ', r.notes + ' note' + (r.notes === 1 ? '' : 's') + ' held back for you to check',
      r.left ? ', ' + r.left + ' unfinished ask' + (r.left === 1 ? '' : 's') + ' left out' : '', '. ',
      r.minutes ? el('a', { href: r.minutes, target: '_blank', rel: 'noopener', text: 'Agenda added to the minutes ↗' }) : (r.minutesNote || '')] : 'This meeting is published and closed.'));
  }
  if (pm && ag.trackerOn) kids.push(agBlock('meet'));
  agBlocksList().forEach(id => kids.push(agBlock(id)));
  if (pm && ag.state === 'shared') {
    const go = agBtn(agPubArmed ? 'Tap again to publish' : 'Publish and close meeting', () => { if (!agPubArmed) { if (agBusy()) { toast('Still saving. Try again in a moment.'); return; } agPubArmed = true; renderAgenda(); } else agPublish(); }, 'pri');
    kids.push(el('div', { class: 'batch' }, [el('span', { id: 'ag-bar', text: agBarText() }), go,
      agPubArmed ? agBtn('Not yet', () => { agPubArmed = false; renderAgenda(); }) : '']));
  }
  if (MODE === 'pm') kids.push(el('section', { class: 'inline' }, [el('a', { class: 'btn ghost', href: pmUrl(), text: 'Back to project-manager view' })]));
  app.replaceChildren(...kids);
  if (agFocus) { const n = document.getElementById(agFocus); agFocus = ''; if (n) n.focus(); }
}

/* ---- loading and keeping fresh */
function agMerge(d) {
  if (!ag || !ag.items || !d.items) { ag = d; return; }
  const local = {};
  ag.items.forEach(x => { local[x.id] = x; });
  d.items = d.items.filter(s => !agGone[s.id]);
  d.items.forEach(s => { const l = local[s.id]; if (l && agDirty[s.id]) Object.keys(agDirty[s.id]).forEach(f => { s[f] = l[f]; }); });
  ag.items.forEach(l => { if (l._new && !d.items.some(s => s.id === l.id)) d.items.push(l); });
  Object.keys(agDirtyN).forEach(a => { d.notes[a] = ag.notes[a]; });
  ag = d;
}
const agTyping = () => { const a = document.activeElement; return !!(a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
function agTick() {
  if (VIEW !== 'agenda' || document.hidden || agBusy() || busy) return;
  qcall('agendaGet', [getMe(), PM_KEY], d => { if (VIEW !== 'agenda' || agBusy()) return; agMerge(d); if (!agTyping()) renderAgenda(); }, () => {});
}
function loadAgenda() { call('agendaGet', [getMe(), PM_KEY], d => { agMerge(d); renderAgenda(); clearInterval(agPoll); agPoll = setInterval(agTick, 8000); }); }
function renderAgendaPage() { if (ag) { renderAgenda(); agTick(); } else loadAgenda(); }

try { new ResizeObserver(postHeight).observe(document.body); } catch (e) { setInterval(postHeight, 1000); }

/* ------------------------------------------------ system map (optional/SystemMap.gs), PM only */
function renderMap(svgText, tips) {
  app.classList.add('wide');
  const holder = document.createElement('div'); holder.innerHTML = svgText;
  const svg = holder.querySelector('svg');
  if (!svg) { app.replaceChildren(el('p', { text: 'Map.html has no drawing yet.' })); return; }
  const tip = svg.querySelector('#tip');
  const NS = 'http://www.w3.org/2000/svg';
  const vb = (svg.getAttribute('viewBox') || '0 0 680 960').split(/\s+/).map(Number);
  const hide = () => { if (tip) tip.style.display = 'none'; };
  function showTip(g, k) {
    const tp = (tips || {})[k];
    if (!tp || !tip) return;
    const b = g.getBBox(), w = 252, h = 26 + tp.l.length * 16 + 10;
    const x = Math.min(Math.max(b.x - 110, 10), vb[2] - 10 - w);
    let y = b.y + b.height + 8; if (y + h > vb[3]) y = b.y - h - 8;
    while (tip.firstChild) tip.removeChild(tip.firstChild);
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', h); r.setAttribute('rx', 8); r.setAttribute('class', 'c-purple'); r.setAttribute('stroke-width', '0.5');
    tip.appendChild(r);
    const line = (s, yy, c) => { const e = document.createElementNS(NS, 'text'); e.setAttribute('x', x + 12); e.setAttribute('y', yy); e.setAttribute('class', c); e.setAttribute('dominant-baseline', 'central'); e.textContent = s; tip.appendChild(e); };
    line(tp.h, y + 16, 'th');
    tp.l.forEach((s, i) => line(s, y + 38 + i * 16, 'ts'));
    tip.style.display = 'inline';
  }
  svg.querySelectorAll('.ai[data-tip]').forEach(g => {
    g.addEventListener('click', ev => { ev.stopPropagation(); showTip(g, g.getAttribute('data-tip')); });
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showTip(g, g.getAttribute('data-tip')); } });
  });
  svg.addEventListener('click', hide);
  const full = el('button', { type: 'button', 'aria-pressed': 'true', text: 'Full wiring' });
  const fe = el('button', { type: 'button', 'aria-pressed': 'false', text: 'Front end only' });
  const setMode = on => { svg.classList.toggle('fe', on); fe.setAttribute('aria-pressed', on ? 'true' : 'false'); full.setAttribute('aria-pressed', on ? 'false' : 'true'); };
  full.addEventListener('click', () => setMode(false));
  fe.addEventListener('click', () => setMode(true));
  const aiBox = el('input', { type: 'checkbox', checked: true, id: 'map-ai' });
  aiBox.addEventListener('change', () => { svg.classList.toggle('noai', !aiBox.checked); if (!aiBox.checked) hide(); });
  app.replaceChildren(
    el('header', {}, [el('div', { class: 'eyebrow', text: ORG + ' · project-manager view' }), el('h1', {}, ['How it all ', el('em', { text: 'fits' })])]),
    el('p', { class: 'small', style: 'margin:0', text: 'People on the left, the system on the right. Click an AI pill to see the manual work it could take over. Switch to Front end only to see just what people open.' }),
    el('div', { class: 'map-ctl' }, [full, fe, el('label', { for: 'map-ai' }, [aiBox, 'Show optional AI'])]),
    el('div', { class: 'sysmap' }, [el('div', { class: 'scroll' }, [svg])]),
    el('section', { class: 'inline' }, [el('a', { class: 'btn ghost', href: pmUrl(), text: 'Back to project-manager view' })])
  );
}
function loadMap() { call('pmMap', [PM_KEY], d => renderMap(d.svg, d.tips)); }
